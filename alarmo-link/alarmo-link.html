<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alarm">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f2430">
<title>Alarm</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 1.5rem;
    font: 1rem/1.4 system-ui, -apple-system, sans-serif;
    background: #1f2430; color: #e8eaed;
    display: flex; flex-direction: column; gap: 1.5rem;
    min-height: 100vh; box-sizing: border-box; justify-content: center;
  }
  h1 { font-size: 1.25rem; font-weight: 600; text-align: center; margin: 0; }
  button {
    font: inherit; font-weight: 600;
    width: 100%; border: none; border-radius: 1rem;
    color: #fff; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button:disabled { opacity: .45; }
  #panel { display: flex; flex-direction: column; gap: 1.5rem; }
  #arm, #disarm { font-size: 1.6rem; padding: 2rem 1rem; }
  #arm    { background: #b3261e; }
  #disarm { background: #1e6b3a; }
  #status {
    font-size: 1.25rem; text-align: center; min-height: 3rem;
    display: flex; align-items: center; justify-content: center;
  }
  .err { color: #ff8a80; }

  /* Setup view */
  #setup { max-width: 34rem; margin: 0 auto; width: 100%; }
  #setup h1 { margin-bottom: 1rem; }
  #generate, #copy { font-size: 1.1rem; padding: 1rem; background: #3b5bdb; }
  .hint { color: #9aa0a6; font-size: .9rem; margin: 0 0 1rem; }
  .field { margin: 1.25rem 0 0; }
  .field label { font-size: .8rem; color: #9aa0a6;
                 text-transform: uppercase; letter-spacing: .05em; }
  .field .row { display: flex; align-items: center; justify-content: space-between;
                gap: .5rem; margin-bottom: .35rem; }
  .icon {
    width: auto; flex: none; background: none; color: #9aa0a6;
    padding: .25rem; border-radius: .375rem; line-height: 0;
  }
  .icon:hover { color: #e8eaed; background: #2c3240; }
  .icon .tick, .icon.ok .mark { display: none; }
  .icon.ok .tick { display: block; }
  .icon.ok { color: #6bd68a; }
  .field code {
    display: block; background: #12151c; border: 1px solid #2c3240;
    border-radius: .5rem; padding: .75rem; font-size: .95rem;
    word-break: break-all; user-select: all;
  }
  label[for="alarm-name"] { display: block; font-size: .8rem; color: #9aa0a6;
                            text-transform: uppercase; letter-spacing: .05em;
                            margin-bottom: .35rem; }
  #alarm-name {
    display: block; width: 100%; box-sizing: border-box;
    font: inherit; padding: .75rem; margin-bottom: 1.25rem;
    background: #12151c; color: #e8eaed;
    border: 1px solid #2c3240; border-radius: .5rem;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<main id="panel" hidden>
  <!-- Replaced by the name from the link, when it carries one. Not translated:
       it is a name, not a label. -->
  <h1 id="panel-title">Alarm</h1>
  <button id="arm" data-i18n="arm">&#128274; Arm</button>
  <button id="disarm" data-i18n="disarm">&#128275; Disarm</button>
  <p id="status"></p>
</main>

<main id="setup" hidden>
  <h1 data-i18n="setupTitle">Alarmo Link &ndash; Setup</h1>
  <p class="hint" data-i18n="setupHint">
    Generate a pair of webhook IDs, paste them into the blueprint, then send the
    person the link below. Anyone holding that link can arm and disarm, so share
    it the way you would share a house key.
  </p>
  <label for="alarm-name" data-i18n="nameLabel">Name of this alarm (optional)</label>
  <input id="alarm-name" type="text" autocomplete="off">

  <button id="generate" data-i18n="generate">Generate IDs</button>

  <div id="result" hidden>
    <div class="field">
      <div class="row">
        <label data-i18n="labelArm">Webhook ID &ndash; arm</label>
        <button class="icon" id="copy-arm" title="Copy"
                aria-label="Copy the arm webhook ID" data-i18n-label="copyArmLabel">
          <svg class="mark" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5.5" width="9" height="9" rx="2"/><path d="M3.5 10.5h-1a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v1"/></svg>
          <svg class="tick" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 5"/></svg>
        </button>
      </div>
      <code id="arm-id"></code>
    </div>
    <div class="field">
      <div class="row">
        <label data-i18n="labelDisarm">Webhook ID &ndash; disarm</label>
        <button class="icon" id="copy-disarm" title="Copy"
                aria-label="Copy the disarm webhook ID" data-i18n-label="copyDisarmLabel">
          <svg class="mark" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5.5" width="9" height="9" rx="2"/><path d="M3.5 10.5h-1a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v1"/></svg>
          <svg class="tick" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 5"/></svg>
        </button>
      </div>
      <code id="disarm-id"></code>
    </div>
    <div class="field">
      <div class="row">
        <label data-i18n="labelLink">Link for this person</label>
      </div>
      <code id="link"></code>
    </div>
    <div class="field">
      <button id="copy" data-i18n="copyLink">Copy link</button>
    </div>
  </div>
</main>

<script>
'use strict';
// The two webhook IDs come from the link fragment (#arm-id,disarm-id) and are
// deliberately not stored in this file - without the link it is worthless.
// The fragment is never sent to the server, so the IDs stay out of access logs.
//
// The panel reports that the command was accepted, not the real state of the
// alarm. Real state would need an API token in the page, which is full access
// to Home Assistant. Use the blueprint's notification instead.

// --- Language ---------------------------------------------------------------
// Add a block below to translate the page; the key names are what the markup
// refers to through data-i18n. Anything missing falls back to English.

var STRINGS = {
  en: {
    arm: '🔒 Arm',
    disarm: '🔓 Disarm',
    sending: 'One moment ...',
    armSent: 'Arm command sent',
    disarmSent: 'Disarm command sent',
    failed: 'Did not work - please call',
    setupTitle: 'Alarmo Link – Setup',
    setupHint: 'Generate a pair of webhook IDs, paste them into the blueprint, ' +
               'then send the person the link below. Anyone holding that link ' +
               'can arm and disarm, so share it the way you would share a house key.',
    generate: 'Generate IDs',
    labelArm: 'Webhook ID – arm',
    labelDisarm: 'Webhook ID – disarm',
    labelLink: 'Link for this person',
    nameLabel: 'Name of this alarm (optional)',
    namePlaceholder: 'Alarm',
    copy: 'Copy',
    copyArmLabel: 'Copy the arm webhook ID',
    copyDisarmLabel: 'Copy the disarm webhook ID',
    copyLink: 'Copy link',
    copied: 'Copied',
    copyManual: 'Press Ctrl+C / long-press to copy'
  },
  de: {
    arm: '🔒 Scharf schalten',
    disarm: '🔓 Unscharf schalten',
    sending: 'Einen Moment ...',
    armSent: 'Scharfschalten gesendet',
    disarmSent: 'Unscharfschalten gesendet',
    failed: 'Hat nicht geklappt - bitte anrufen',
    setupTitle: 'Alarmo Link – Einrichtung',
    setupHint: 'Zwei Webhook-IDs erzeugen, ins Blueprint eintragen und der ' +
               'Person den Link unten schicken. Wer den Link hat, kann scharf ' +
               'und unscharf schalten - gib ihn so weiter, wie du einen ' +
               'Haustürschlüssel weitergibst.',
    generate: 'IDs erzeugen',
    labelArm: 'Webhook-ID – scharf',
    labelDisarm: 'Webhook-ID – unscharf',
    labelLink: 'Link für diese Person',
    nameLabel: 'Name dieses Alarms (optional)',
    namePlaceholder: 'Alarm',
    copy: 'Kopieren',
    copyArmLabel: 'Webhook-ID zum Scharfschalten kopieren',
    copyDisarmLabel: 'Webhook-ID zum Unscharfschalten kopieren',
    copyLink: 'Link kopieren',
    copied: 'Kopiert',
    copyManual: 'Mit Strg+C kopieren / lange drücken'
  }
};

var langs = navigator.languages || [navigator.language || 'en'];
var lang = 'en';
for (var l = 0; l < langs.length; l++) {
  var code = String(langs[l]).slice(0, 2).toLowerCase();
  if (STRINGS[code]) { lang = code; break; }
}
var T = STRINGS[lang];
document.documentElement.lang = lang;

each('[data-i18n]', function (el, key) { el.textContent = T[key]; }, 'data-i18n');
each('[data-i18n-label]', function (el, key) {
  el.title = T.copy;
  el.setAttribute('aria-label', T[key]);
}, 'data-i18n-label');

function each(selector, fn, attr) {
  var nodes = document.querySelectorAll(selector);
  for (var i = 0; i < nodes.length; i++) {
    var key = nodes[i].getAttribute(attr);
    if (T[key]) fn(nodes[i], key);
  }
}

// A malformed percent-escape would throw and take the whole page with it, so a
// broken name must not stop the buttons from working.
function decode(value) {
  if (!value) return '';
  try { return decodeURIComponent(value); } catch (err) { return ''; }
}

// --- Mode -------------------------------------------------------------------

// Fragment: <arm-id>,<disarm-id>[,<name>] - the name is percent-encoded, so a
// comma inside it cannot split the fragment apart.
var ids = location.hash.slice(1).split(',');

if (ids.length >= 2 && ids[0] && ids[1]) {
  setupPanel();
} else {
  setupWizard();
}

// --- Panel: two buttons, one POST each -------------------------------------

function setupPanel() {
  var panel = document.getElementById('panel');
  var out = document.getElementById('status');
  var buttons = [document.getElementById('arm'), document.getElementById('disarm')];
  panel.hidden = false;

  var name = decode(ids[2]);
  if (name) {
    document.getElementById('panel-title').textContent = name;
    document.title = name;
  }

  function send(i, text) {
    buttons.forEach(function (b) { b.disabled = true; });
    out.className = '';
    out.textContent = T.sending;

    fetch('/api/webhook/' + ids[i], { method: 'POST' })
      .then(function (r) {
        if (!r.ok) throw new Error(r.status);
        out.textContent = text;
      })
      .catch(function () {
        out.className = 'err';
        out.textContent = T.failed;
      })
      .finally(function () {
        buttons.forEach(function (b) { b.disabled = false; });
      });
  }

  buttons[0].onclick = function () { send(0, T.armSent); };
  buttons[1].onclick = function () { send(1, T.disarmSent); };
}

// --- Wizard: generate a pair of IDs and show the finished link --------------

function setupWizard() {
  var setup = document.getElementById('setup');
  var result = document.getElementById('result');
  var armEl = document.getElementById('arm-id');
  var disarmEl = document.getElementById('disarm-id');
  var linkEl = document.getElementById('link');
  var copyBtn = document.getElementById('copy');
  setup.hidden = false;

  // 64-character alphabet and a byte mask of 63: 256 is a multiple of 64, so
  // every character is equally likely. 32 characters = 192 bits.
  function newId() {
    var alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
    var bytes = new Uint8Array(32);
    crypto.getRandomValues(bytes);
    var id = '';
    for (var i = 0; i < bytes.length; i++) id += alphabet[bytes[i] & 63];
    return id;
  }

  var nameInput = document.getElementById('alarm-name');
  nameInput.placeholder = T.namePlaceholder;

  document.getElementById('generate').onclick = function () {
    var arm = newId();
    var disarm = newId();
    var name = nameInput.value.trim();
    armEl.textContent = arm;
    disarmEl.textContent = disarm;
    linkEl.textContent = location.origin + location.pathname + '#' + arm + ',' + disarm +
      (name ? ',' + encodeURIComponent(name) : '');
    result.hidden = false;
    copyBtn.textContent = T.copyLink;
  };

  copy(document.getElementById('copy-arm'), armEl);
  copy(document.getElementById('copy-disarm'), disarmEl);
  copy(copyBtn, linkEl);

  // One copy handler for the two icons and the link button. The icons confirm
  // by swapping to a tick, the wide button by changing its label.
  function copy(btn, src) {
    btn.onclick = function () {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(src.textContent).then(confirm, fallback);
      } else {
        fallback();
      }
    };

    function confirm() {
      if (btn === copyBtn) {
        btn.textContent = T.copied;
      } else {
        btn.classList.add('ok');
        setTimeout(function () { btn.classList.remove('ok'); }, 1500);
      }
    }

    // Where the clipboard API is unavailable (plain HTTP, old browsers):
    // select the text so it can be copied by hand.
    function fallback() {
      var range = document.createRange();
      range.selectNodeContents(src);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      if (btn === copyBtn) btn.textContent = T.copyManual;
    }
  }
}
</script>
</body>
</html>
